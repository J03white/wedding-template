name = "PLACEHOLDER_WORKER_NAME"
compatibility_date = "2025-01-01"
main = "src/worker.js"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
CF_TEAM_DOMAIN = "PLACEHOLDER_CF_TEAM_DOMAIN"
GOOGLE_SERVICE_ACCOUNT_EMAIL = "PLACEHOLDER_GOOGLE_SERVICE_ACCOUNT_EMAIL"
GOOGLE_SHEET_ID = "PLACEHOLDER_GOOGLE_SHEET_ID"
SITE_PASSWORD = "PLACEHOLDER_SITE_PASSWORD"
PHOTO_STORAGE_PROVIDER = "dropbox"
DROPBOX_APP_KEY = "PLACEHOLDER_DROPBOX_APP_KEY"
DROPBOX_FOLDER_PATH = "PLACEHOLDER_DROPBOX_FOLDER_PATH"
