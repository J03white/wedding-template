baseURL = 'https://PLACEHOLDER_SITE_DOMAIN/'
languageCode = 'en-gb'
title = 'PLACEHOLDER_COUPLE_NAMES'

[params]
  # coupleName, weddingDate, weddingDateFull, venue, location now live in
  # data/settings.yaml (CMS: "Site Details") so the couple can edit them
  # without a dev touching hugo.toml.
  # RSVP submissions post to the same "/rsvp" Pages Function in every
  # environment — Cloudflare Pages selects the right Google Sheet via its
  # Production/Preview environment variables, not via Hugo config.
  turnstileSiteKey    = "PLACEHOLDER_TURNSTILE_KEY"
  maxAdditionalGuests = 8

[[menus.main]]
  name   = "Travel"
  url    = "/travel/"
  weight = 2

[[menus.main]]
  name   = "Accommodation"
  url    = "/accommodation/"
  weight = 3

[[menus.main]]
  name   = "FAQ"
  url    = "/faq/"
  weight = 4

[[menus.main]]
  name   = "RSVP"
  url    = "/rsvp/"
  weight = 5
